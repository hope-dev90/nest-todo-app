services:
  - type: web
    name: todo-app
    env: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run client:install --legacy-peer-deps && npm run client:build && npm run build
    startCommand: node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: todo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: '587'
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: todo-db
    databaseName: todo_db
    user: todo_user
    plan: free
