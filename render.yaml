services:
  - type: web
    name: todo-app
    env: node
    plan: free
    buildCommand: |
      set -e
      echo "=== STARTING BUILD ==="
      pwd
      ls -la
      echo "=== INSTALLING ROOT DEPENDENCIES ==="
      npm install --legacy-peer-deps
      echo "=== NODE_MODULES ==="
      ls -la node_modules
      echo "=== INSTALLING CLIENT DEPENDENCIES ==="
      cd client && npm install --legacy-peer-deps && cd ..
      echo "=== BUILDING CLIENT ==="
      cd client && npm run build && cd ..
      echo "=== CHECKING CLIENT BUILD ==="
      ls -la client/build
      echo "=== RUNNING BUILD ==="
      npm run build
      echo "=== CHECKING DIST ==="
      ls -la dist
      if [ ! -f dist/main.js ]; then
        echo "ERROR: dist/main.js not found!"
        exit 1
      fi
      echo "=== DONE ==="
    startCommand: node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: todo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: '587'
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: todo-db
    databaseName: todo_db
    user: todo_user
    plan: free
